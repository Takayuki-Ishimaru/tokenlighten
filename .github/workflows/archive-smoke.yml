name: archive-smoke

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose uploaded archives should be verified
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    name: archive (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ARCHIVE_PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the uploaded release archive
        run: |
          RELEASE_TAG="${RELEASE_TAG#release/}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern "tokenlighten-${RELEASE_TAG#v}-${ARCHIVE_PLATFORM}.tgz" --pattern SHA256SUMS
      - name: Verify the installed archive
        run: node scripts/smoke-install-archive.mjs "release-assets/tokenlighten-${RELEASE_TAG#v}-${ARCHIVE_PLATFORM}.tgz" release-assets/SHA256SUMS
      - name: Verify Windows runtime signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "tokenlighten-$($env:RELEASE_TAG.Substring(1))-$env:ARCHIVE_PLATFORM"
          New-Item -ItemType Directory signature-check | Out-Null
          tar xzf "release-assets/$name.tgz" -C signature-check
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          $signature = Get-AuthenticodeSignature "signature-check/$name/runtime/node.exe"
          if ($signature.Status -ne 'Valid') { throw "Invalid Node.js signature: $($signature.Status)" }
          Write-Output $signature.SignerCertificate.Subject
      - name: Verify macOS runtime signature
        if: runner.os == 'macOS'
        run: |
          name="tokenlighten-${RELEASE_TAG#v}-${ARCHIVE_PLATFORM}"
          mkdir signature-check
          tar xzf "release-assets/$name.tgz" -C signature-check
          codesign --verify --strict "signature-check/$name/runtime/node"
          codesign -dv "signature-check/$name/runtime/node"
